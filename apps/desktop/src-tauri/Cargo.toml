[package]
name = "aicommerce-desktop"
version = "0.1.0"
description = "AI Commerce — aplicativo desktop do proprietário"
edition = "2021"
rust-version = "1.80"

[lib]
name = "aicommerce_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
# Notificações do sistema (aprovação nova, kill switch) — versão fixa
tauri-plugin-notification = "=2.5.1"
# Abrir com o sistema (opt-in nas Configurações; desligado por padrão) — versão fixa
tauri-plugin-autostart = "=2.7.0"
# Atualização automática a partir do servidor do proprietário (pacotes assinados com a chave do updater) — versão fixa
tauri-plugin-updater = "=2.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cofre do sistema: Keychain (macOS) / Credential Manager (Windows). Segredo do "computador lembrado".
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
