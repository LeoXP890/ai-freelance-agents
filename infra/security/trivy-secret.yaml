# Exceções do scan de segredos (Trivy). Cada uma precisa de justificativa e escopo mínimo.
allow-rules:
  - id: anthropic-sdk-docstring
    description: >-
      Falso positivo revisado em 2026-10-24: docstrings do SDK anthropic citam o literal
      `{"type": "service_account"}` (principal de execução de agentes), não uma chave GCP.
    path: .*/anthropic/(resources|types)/beta/.*
    regex: '"type": "service_account"\}'
