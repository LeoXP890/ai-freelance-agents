# Produção na VPS (QA-006): HTTPS automático (Caddy + Let's Encrypt) com o domínio da API nas portas 80/443.
# Uso (na VPS): ./scripts/deploy.sh   — equivale a:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/production.yml --env-file infra/env/live.env up -d --build --wait
# Pré-requisito: o DNS do domínio (registro A) já aponta para o IP da VPS; portas 80 e 443 liberadas no firewall.
services:
  reverse-proxy:
    ports: !override ["80:80", "443:443", "443:443/udp"]
    environment:
      AIC_SITE_ADDRESS: "${AIC_DOMAIN:?defina AIC_DOMAIN no live.env, por exemplo api.sualoja.com.br}"
    volumes: [caddy_data:/data, caddy_config:/config]  # certificados persistem entre deploys

volumes:
  caddy_data: {}
  caddy_config: {}
