# Prometheus do AI Commerce (INF-005). Local: infra/compose/observability.yml. VPS: mesmo arquivo, token real.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: aicommerce-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]  # o modo (DRY_RUN/LIVE) vem nas próprias métricas da API
